version: '3.8'

services:
  web:
    build: .
    container_name: zero-container
    ports:
      - "9000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: python backend_sp/manage.py runserver 0.0.0.0:8000

  bot:
    build: .
    container_name: zero-bot
    env_file:
      - .env
    depends_on:
      - web
    command: python telegram_bot/main.py
